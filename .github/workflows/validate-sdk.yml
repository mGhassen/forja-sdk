name: Validate SDK

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Contract index + schemas parse
        run: |
          set -euo pipefail
          test -f contract.json
          test -f catalog-kit.js
          test -f torrent-kit.js
          test -f DEVELOPING.md
          node -e "JSON.parse(require('fs').readFileSync('contract.json','utf8'))"
          for s in schema/manifest.schema.json schema/catalog-envelope.schema.json \
            schema/vod-stream.schema.json schema/torrent-search.schema.json \
            schema/torrent-row.schema.json; do
            test -f "$s"
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$s"
            echo "ok: $s"
          done
          for f in fixtures/*.json; do
            node -e "JSON.parse(require('fs').readFileSync(process.argv[1],'utf8'))" "$f"
            echo "ok: $f"
          done
